name: revola-agent
services:
  mailpit:
    image: axllent/mailpit:v1.27.4
    ports: ["127.0.0.1:8025:8025", "127.0.0.1:1025:1025"]
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-revola_agent}
      POSTGRES_USER: ${POSTGRES_USER:-revola}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    environment:
      ASPNETCORE_HTTP_PORTS: 8080
      ASPNETCORE_ENVIRONMENT: Development
      Identity__MailpitHost: mailpit
      ConnectionStrings__Database: Host=postgres;Database=${POSTGRES_DB:-revola_agent};Username=${POSTGRES_USER:-revola};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports: ["127.0.0.1:5080:8080"]
    depends_on:
      postgres: {condition: service_healthy}
      mailpit: {condition: service_started}
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    environment:
      ConnectionStrings__Database: Host=postgres;Database=${POSTGRES_DB:-revola_agent};Username=${POSTGRES_USER:-revola};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    depends_on:
      postgres: {condition: service_healthy}
volumes:
  postgres-data:
