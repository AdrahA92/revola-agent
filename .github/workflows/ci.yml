name: Foundation CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore RevolaAgent.slnx
      - run: dotnet build RevolaAgent.slnx --no-restore -c Release
      - run: dotnet tool restore
      - run: dotnet ef migrations has-pending-model-changes --project src/RevolaAgent.Infrastructure --startup-project src/RevolaAgent.Api --configuration Release --no-build
      - run: dotnet ef migrations script --idempotent --project src/RevolaAgent.Infrastructure --startup-project src/RevolaAgent.Api --configuration Release --no-build --output /tmp/revola-migrations.sql
      - run: dotnet test RevolaAgent.slnx --no-build -c Release --logger trx
      - name: Validate Docker configuration
        env:
          POSTGRES_PASSWORD: ci-ephemeral-not-a-production-secret
        run: docker compose config --quiet
      - run: docker build --target api -t revola-api-ci .
      - run: docker build --target worker -t revola-worker-ci .
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/revola-agent-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/revola-agent-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository history
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.2 detect --source=/repo --redact --no-banner
